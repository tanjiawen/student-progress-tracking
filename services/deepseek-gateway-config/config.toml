# DeepSeek Gateway 配置
# 请通过环境变量 DEEPSEEK_API_KEY 传入 API Key
# 或手动修改此文件后注意保密

api_key = "${DEEPSEEK_API_KEY}"
base_url = "https://api.deepseek.com"
default_text_model = "deepseek-chat"
provider = "deepseek"

[providers.deepseek]
api_key = "${DEEPSEEK_API_KEY}"
base_url = "https://api.deepseek.com"
model = "deepseek-chat"

[network]
web_search = { enabled = true, default_engine = "duckduckgo" }
fetch_url = { enabled = true, max_size_mb = 10 }

[snapshots]
enabled = true
max_snapshots = 50

[lsp]
enabled = false
